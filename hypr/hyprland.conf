# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

source = ~/.cache/wal/colors-hyprland.conf

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$browser = Brave

### INI ###
source = ~/.config/hypr/pywal-colors.conf

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 2
    }
    
    shadow {
        enabled = true
        range = 50
        render_power = 3
        color = rgba(00000055)
    }
}

general {
    border_size = 3

    col.active_border = $color4
    col.inactive_border = $color0

    gaps_in = 5
    gaps_out = 10
}
  

### ANIMATIONS ###

