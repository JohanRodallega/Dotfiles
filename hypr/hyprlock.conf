background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.2
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    hide_cursor = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(196,196,193,1.0)

    font_size = 90
    font_family = JetBrainsMono Nerd Font

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = rgba(196,196,193,0.8)

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 300, 55

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2

    outer_color = rgba(59,74,73,1.0)
    inner_color = rgba(19,21,9,0.85)

    font_color = rgba(196,196,193,1.0)

    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = 🔒
    color = rgba(196,196,193,1.0)

    font_size = 48

    position = 0, -170
    halign = center
    valign = center
}
